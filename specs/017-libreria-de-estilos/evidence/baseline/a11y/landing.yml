- main:
  - heading "Juega con gente de tu nivel, a tu hora." [level=1]
  - paragraph: Cruzamos tu rango con tu horario semanal. Terminas con una sesión agendada, no con una lista de desconocidos.
  - link "Crear cuenta"
  - link "Ya tengo cuenta"
  - 'img "Tres condiciones que se cruzan: mismo juego, rango similar y horas en común. El emparejamiento ocurre solo donde se cumplen las tres."': match
  - text: Mismo juego Rango similar Horas en común
  - list:
    - listitem: League of Legends
    - listitem: Rainbow Six Siege
    - listitem: Counter-Strike 2
    - listitem: League of Legends
    - listitem: Rainbow Six Siege
    - listitem: Counter-Strike 2
  - region "Tres condiciones. Una sola hora.":
    - heading "Tres condiciones. Una sola hora." [level=2]:
      - text: Tres condiciones.
      - emphasis: Una sola hora.
    - paragraph: Discord y los foros resuelven una a la vez. Aquí se cruzan las tres antes de que escribas el primer mensaje.
    - list:
      - listitem:
        - text: "01"
        - heading "Tu rango se lee, no se declara" [level=3]
        - paragraph: Vinculas tu Riot ID, Ubisoft ID o SteamID64. El rango se vuelve a leer al pulsar "Resincronizar".
      - listitem:
        - text: "02"
        - heading "Tus horas se cruzan con las de otros" [level=3]
        - paragraph: Marcas tu semana arrastrando sobre la grilla. Encendemos solo los bloques que compartes con jugadores de tu nivel.
